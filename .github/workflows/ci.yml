name: cargo

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Install OpenSSH server for P5/P6 E2E
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq openssh-server
      - name: P6 headless full gate (locked workspace and deterministic E2E)
        run: bash scripts/ci/p6-headless.sh
