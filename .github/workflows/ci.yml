name: cargo

on:
  push:
  pull_request:

jobs:
  windows-native:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      # Run every diagnostic even if a previous one fails. Failures are not
      # suppressed: this job remains red until Windows incompatibilities are fixed.
      - name: Format
        if: ${{ always() }}
        run: cargo fmt --all -- --check
      - name: Check workspace
        if: ${{ always() }}
        run: cargo check --workspace --locked
      - name: Clippy workspace
        if: ${{ always() }}
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Native Rust tests
        if: ${{ always() }}
        run: cargo test --workspace --locked
      - name: Build workspace
        if: ${{ always() }}
        run: cargo build --workspace --locked
      - name: W1-A token isolation process regression
        run: pwsh -NoProfile -File tests/windows/w1a-token-isolation.ps1

  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Install OpenSSH server for P5/P6 E2E
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq openssh-server
      - run: cargo fmt --all -- --check
      - name: Validar sintaxis de scripts E2E
        run: |
          for script in tests/*.sh; do bash -n "$script"; done
      - run: cargo clippy --workspace --exclude gentle-fleet-desktop --all-targets --locked -- -D warnings
      - run: cargo test --workspace --exclude gentle-fleet-desktop --locked
      - run: cargo build --workspace --exclude gentle-fleet-desktop --locked
      - name: e2e con FakeDriver (sin servicios de pago)
        run: tests/e2e_fake.sh
      - name: e2e concurrencia y aislamiento
        run: tests/e2e_concurrency.sh
      - name: e2e backpressure
        run: tests/e2e_backpressure.sh
      - name: e2e permisos de socket sin root
        run: tests/e2e_unix_permissions.sh
      - name: e2e persistencia y reinicio de fleetd
        run: tests/e2e_persistence.sh
      - name: e2e aprobaciones deterministas
        run: tests/e2e_approvals.sh
      - name: e2e supervivencia del runner tras SIGKILL de fleetd
        run: tests/e2e_p3_survival.sh
      - name: e2e aprobación pendiente durante desconexión del daemon
        run: tests/e2e_p3_approval_disconnect.sh
      - name: e2e identidad y versión de runner inválidas
        run: tests/e2e_p3_identity.sh
      - name: e2e pérdida de salud del proveedor
        run: tests/e2e_p3_provider_health.sh
      - name: e2e muerte del runner con fail-closed
        run: tests/e2e_p3_runner_kill.sh
      - name: e2e dos caídas de daemon con sesiones concurrentes
        run: tests/e2e_p3_multi_session.sh
      - name: e2e replay completo con mas de 256 eventos
        run: tests/e2e_long_replay.sh
      # P4.4-H: fixtures deterministas; no requieren CLIs ni credenciales de pago.
      # Los 4 proveedores nativos se siguen probando solo con GF_E2E_REAL=1 local.
      - name: e2e P4.4 conformidad contrato FakeDriver
        run: GF_E2E_FAKE_ONLY=1 tests/e2e_p44_conformity.sh
      - name: e2e P4.4 aislamiento y turno superviviente FakeDriver
        run: GF_E2E_FAKE_ONLY=1 tests/e2e_p44_concurrency.sh
      - name: e2e P4.4 privacidad y tokens FakeDriver
        run: GF_E2E_FAKE_ONLY=1 tests/e2e_p44_security.sh
      - name: e2e P4.4 redaccion de credenciales inyectadas
        run: tests/e2e_p44_redaction.sh
      - name: e2e P4.4 aprobaciones sin autoaprobacion
        run: tests/e2e_p44_approvals.sh
      - name: e2e P5 transporte SSH local
        run: |
          if command -v sshd >/dev/null 2>&1; then
            tests/e2e_p51_ssh.sh
          else
            echo "SKIP: sshd not installed in CI image"
          fi
      - name: e2e P5 dos hosts SSH aislados
        run: |
          if command -v sshd >/dev/null 2>&1; then
            tests/e2e_p52_two_hosts.sh
          else
            echo "SKIP: sshd not installed in CI image"
          fi
      - name: e2e P6.1 SDK local con FakeDriver
        run: tests/e2e_p61_sdk.sh

  desktop-gpui-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Instalar dependencias nativas de GPUI (Linux X11/Wayland)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            libfontconfig1-dev libfreetype-dev libwayland-dev libxkbcommon-dev \
            libxkbcommon-x11-dev libx11-dev libx11-xcb-dev libxext-dev \
            libxfixes-dev libxi-dev libxcursor-dev libxrandr-dev libxrender-dev \
            libxcb-dri3-dev libxcb-present-dev libxcb-randr0-dev \
            libxcb-render0-dev libxcb-shape0-dev libxcb-sync-dev \
            libxcb-xfixes0-dev libxcb-xkb-dev libvulkan-dev
      - name: Instalar OpenSSH server para el E2E GPUI
        run: sudo apt-get install -y -qq openssh-server
      - run: cargo fmt --all -- --check
      - run: cargo check -p gentle-fleet-desktop --locked
      - run: cargo clippy -p gentle-fleet-desktop --all-targets --locked -- -D warnings
      - run: cargo test -p gentle-fleet-desktop --locked
      - run: cargo build -p gentle-fleet-desktop --locked
      - name: e2e P6.2-B consultas reales desde GPUI (local + SSH fixture)
        run: tests/e2e_p62b_desktop_gpui.sh
