name: p3-one-time-rustfmt
on:
  push:
    branches:
      - feature/p3-persistent-runner
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Format P3 fixes and push to feature branch
        shell: bash
        run: |
          cargo fmt --all
          if ! git diff --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add crates
            git commit -m "style(p3): format runner reliability fixes"
            git push origin HEAD:feature/p3-persistent-runner
          fi
