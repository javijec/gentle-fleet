name: p2-one-time-format
on:
  push:
    branches:
      - feature/p2-persistence-approvals
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Format and commit Rust sources
        shell: bash
        run: |
          cargo fmt --all
          if ! git diff --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add crates
            git commit -m "style(p2): format final review fixes"
            git push origin HEAD:feature/p2-persistence-approvals
          fi
