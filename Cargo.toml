[workspace]
resolver = "2"
members = [
  "crates/fleet-domain",
  "crates/fleet-protocol",
  "crates/fleet-agent",
  "crates/fleet-core",
  "crates/fleet-store-sqlite",
  "crates/fleet-driver-opencode",
  "crates/fleet-driver-codex",
  "crates/fleet-driver-pi",
  "crates/fleet-rpc-jsonl",
  "crates/fleet-driver-gentle-shell",
  "crates/fleet-conformance",
  "crates/fleet-ssh",
  "crates/fleet-client",
  "crates/fleet-providers",
  "crates/fleetd",
  "crates/fleetctl",
  "crates/fleet-runner",
  "apps/desktop",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
reqwest = { version = "=0.12.28", default-features = false, features = ["blocking", "json"] }
base64 = "=0.22.1"
uuid = { version = "=1.29.3", features = ["v4"] }
rusqlite = { version = "=0.43.0", features = ["bundled"] }

[patch.crates-io]
# xattr 0.2.3 references libc::ENOATTR on Linux; Linux exposes the same
# condition as ENODATA in current libc releases.
xattr = { path = "apps/desktop/vendor/xattr" }
